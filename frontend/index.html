<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excel Agent - 智能数据分析</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif;
            background: #f0f2f5;
            height: 100vh;
            display: flex;
        }

        /* ===== 左侧面板 ===== */
        .sidebar {
            width: 320px;
            background: #fff;
            border-right: 1px solid #e8e8e8;
            display: flex;
            flex-direction: column;
            padding: 20px;
            overflow: hidden;
        }
        .sidebar h1 {
            font-size: 20px;
            color: #1a1a1a;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .upload-zone {
            border: 2px dashed #d9d9d9;
            border-radius: 8px;
            padding: 30px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 16px;
            flex-shrink: 0;
        }
        .upload-zone:hover, .upload-zone.dragover {
            border-color: #1890ff;
            background: #e6f7ff;
        }
        .upload-zone .icon { font-size: 36px; margin-bottom: 8px; }
        .upload-zone p { color: #666; font-size: 14px; }

        .file-info {
            background: #f6ffed;
            border: 1px solid #b7eb8f;
            border-radius: 6px;
            padding: 12px;
            margin-bottom: 16px;
            font-size: 13px;
            display: none;
            flex-shrink: 0;
        }
        .file-info.show { display: block; }
        .file-info .name { font-weight: 600; color: #52c41a; }

        .summary-box {
            flex: 1;
            overflow-y: auto;
            background: #fafafa;
            border-radius: 6px;
            padding: 12px;
            font-size: 12px;
            font-family: 'Menlo', 'Consolas', monospace;
            white-space: pre-wrap;
            color: #555;
            display: none;
        }
        .summary-box.show { display: block; }

        /* ===== 右侧主区域 ===== */
        .main-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }

        .message {
            max-width: 80%;
            margin-bottom: 16px;
            display: flex;
            gap: 10px;
        }
        .message.user { margin-left: auto; flex-direction: row-reverse; }
        .message .avatar {
            width: 36px; height: 36px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 16px;
            flex-shrink: 0;
        }
        .message.user .avatar { background: #1890ff; color: #fff; }
        .message.assistant .avatar { background: #f0f0f0; }
        .message .bubble {
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.6;
            word-break: break-word;
        }
        .message.user .bubble {
            background: #1890ff; color: #fff;
            border-bottom-right-radius: 4px;
        }
        .message.assistant .bubble {
            background: #fff; border: 1px solid #e8e8e8;
            border-bottom-left-radius: 4px;
        }

        /* Markdown 渲染样式 */
        .message .bubble p { margin: 4px 0; }
        .message .bubble pre {
            background: #f5f5f5; padding: 8px 12px;
            border-radius: 4px; overflow-x: auto;
            font-size: 13px; margin: 8px 0;
        }
        .message .bubble code {
            background: #f5f5f5; padding: 2px 4px;
            border-radius: 3px; font-size: 13px;
        }
        .message .bubble table {
            border-collapse: collapse; margin: 8px 0; font-size: 13px;
        }
        .message .bubble th, .message .bubble td {
            border: 1px solid #ddd; padding: 6px 10px;
        }
        .message .bubble th { background: #fafafa; }

        .tool-hint {
            color: #8c8c8c; font-size: 12px;
            font-style: italic; margin-top: 4px;
        }

        .chart-container {
            width: calc(100% - 40px);
            height: 320px;
            margin: 0 20px 12px;
            border-radius: 8px;
            background: #fff;
            border: 1px solid #e8e8e8;
            display: none;
            flex-shrink: 0;
        }
        .chart-container.show { display: block; }

        .input-area {
            padding: 16px 20px;
            background: #fff;
            border-top: 1px solid #e8e8e8;
            display: flex;
            gap: 12px;
            flex-shrink: 0;
        }
        .input-area input {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid #d9d9d9;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
        }
        .input-area input:focus { border-color: #1890ff; }
        .input-area button {
            padding: 12px 24px;
            background: #1890ff; color: #fff;
            border: none; border-radius: 8px;
            font-size: 14px; cursor: pointer;
            transition: background 0.3s;
            min-width: 80px;
        }
        .input-area button:hover { background: #40a9ff; }
        .input-area button:disabled { background: #d9d9d9; cursor: not-allowed; }
        .input-area button.stop { background: #ff4d4f; }
        .input-area button.stop:hover { background: #ff7875; }

        .typing-indicator {
            display: inline-flex; gap: 4px; padding: 8px 12px;
        }
        .typing-indicator span {
            width: 6px; height: 6px;
            background: #999; border-radius: 50%;
            animation: bounce 1.4s infinite;
        }
        .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes bounce {
            0%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-6px); }
        }
    </style>
</head>
<body>
    <!-- 左侧：文件上传 & 结构预览 -->
    <div class="sidebar">
        <h1>📊 Excel Agent</h1>

        <div class="upload-zone" id="uploadZone">
            <div class="icon">📁</div>
            <p>点击或拖拽上传 Excel 文件</p>
            <p style="color:#999;font-size:12px;margin-top:4px">支持 .xlsx / .xls / .csv（≤100MB）</p>
        </div>
        <input type="file" id="fileInput" accept=".xlsx,.xls,.csv" hidden>

        <div class="file-info" id="fileInfo">
            <div class="name" id="fileName"></div>
        </div>

        <div class="summary-box" id="summaryBox"></div>
    </div>

    <!-- 右侧：对话区 -->
    <div class="main-area">
        <div class="chat-container" id="chatContainer">
            <div class="message assistant">
                <div class="avatar">🤖</div>
                <div class="bubble">你好！我是 Excel 数据分析助手。<br>请先上传一个 Excel 文件，然后告诉我你想分析什么。</div>
            </div>
        </div>

        <div class="chart-container" id="chartContainer"></div>

        <div class="input-area">
            <input type="text" id="msgInput"
                   placeholder="输入你的问题，例如：帮我统计各部门的销售总额..."
                   onkeypress="if(event.key==='Enter') handleSendClick()">
            <button id="sendBtn" onclick="handleSendClick()">发送</button>
        </div>
    </div>

    <script>
        // ============ 全局状态 ============
        let sessionId = null;
        let chartInstance = null;
        let isStreaming = false;
        let currentAbortController = null;

        const API_BASE = window.location.origin;
        const SSE_TIMEOUT_MS = 120000; // 2 分钟超时

        // ============ Markdown 安全渲染 ============
        function renderMarkdown(text) {
            if (!text) return '';
            const html = marked.parse(text);
            return DOMPurify.sanitize(html);
        }

        // ============ 文件上传 ============
        const uploadZone = document.getElementById('uploadZone');
        const fileInput  = document.getElementById('fileInput');

        uploadZone.addEventListener('click', () => fileInput.click());
        uploadZone.addEventListener('dragover', e => {
            e.preventDefault();
            uploadZone.classList.add('dragover');
        });
        uploadZone.addEventListener('dragleave', () => {
            uploadZone.classList.remove('dragover');
        });
        uploadZone.addEventListener('drop', e => {
            e.preventDefault();
            uploadZone.classList.remove('dragover');
            if (e.dataTransfer.files.length) uploadFile(e.dataTransfer.files[0]);
        });
        fileInput.addEventListener('change', () => {
            if (fileInput.files.length) uploadFile(fileInput.files[0]);
        });

        async function uploadFile(file) {
            const formData = new FormData();
            formData.append('file', file);

            try {
                const res = await fetch(`${API_BASE}/api/upload`, {
                    method: 'POST',
                    body: formData,
                });
                if (!res.ok) {
                    const err = await res.json().catch(() => ({}));
                    throw new Error(err.detail || `HTTP ${res.status}`);
                }
                const data = await res.json();
                sessionId = data.session_id;

                document.getElementById('fileInfo').classList.add('show');
                document.getElementById('fileName').textContent = `✅ ${data.file_name}`;

                const summaryBox = document.getElementById('summaryBox');
                summaryBox.classList.add('show');
                summaryBox.textContent = data.summary;

                addMessage('assistant',
                    `文件 **${data.file_name}** 已上传成功！\n\n` +
                    '```\n' + data.summary + '\n```\n\n' +
                    '你可以问我关于这个文件的任何问题。'
                );
            } catch (err) {
                addMessage('assistant', `❌ 上传失败: ${err.message}`);
            }
        }

        // ============ 发送 / 停止 按钮 ============
        function handleSendClick() {
            if (isStreaming && currentAbortController) {
                // 点击停止
                currentAbortController.abort();
                currentAbortController = null;
                isStreaming = false;
                setSendButton(false);
                addMessage('assistant', '⏹️ 已取消生成。');
                return;
            }
            sendMessage();
        }

        function setSendButton(streaming) {
            const btn = document.getElementById('sendBtn');
            if (streaming) {
                btn.textContent = '停止';
                btn.classList.add('stop');
                btn.disabled = false;
            } else {
                btn.textContent = '发送';
                btn.classList.remove('stop');
                btn.disabled = false;
            }
        }

        // ============ 对话 ============
        async function sendMessage() {
            const input = document.getElementById('msgInput');
            const msg = input.value.trim();
            if (!msg || isStreaming) return;

            if (!sessionId) {
                addMessage('assistant', '⚠️ 请先上传一个 Excel 文件。');
                return;
            }

            input.value = '';
            addMessage('user', msg);

            const loadingId = addLoading();
            isStreaming = true;
            currentAbortController = new AbortController();
            setSendButton(true);

            const timeoutId = setTimeout(() => {
                if (currentAbortController) currentAbortController.abort();
            }, SSE_TIMEOUT_MS);

            try {
                const res = await fetch(`${API_BASE}/api/chat`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        session_id: sessionId,
                        message: msg,
                    }),
                    signal: currentAbortController.signal,
                });

                if (!res.ok) throw new Error(`HTTP ${res.status}`);

                removeLoading(loadingId);

                const bubbleId = addMessage('assistant', '');
                const bubble = document.querySelector(
                    `[data-msg-id="${bubbleId}"] .bubble`
                );
                let fullText = '';

                const reader  = res.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split('\n');
                    buffer = lines.pop();

                    for (const line of lines) {
                        if (!line.startsWith('data: ')) continue;
                        try {
                            const data = JSON.parse(line.slice(6));

                            if (data.type === 'text') {
                                fullText += data.content;
                                bubble.innerHTML = renderMarkdown(fullText);
                            } else if (data.type === 'tool_start') {
                                const hint = document.createElement('div');
                                hint.className = 'tool-hint';
                                hint.textContent = data.content;
                                bubble.appendChild(hint);
                            } else if (data.type === 'chart') {
                                renderChart(JSON.parse(data.content));
                            } else if (data.type === 'error') {
                                fullText += `\n\n❌ ${data.content}`;
                                bubble.innerHTML = renderMarkdown(fullText);
                            }
                        } catch (_) { /* 忽略解析错误 */ }
                    }
                }

                scrollChatToBottom();

            } catch (err) {
                removeLoading(loadingId);
                if (err.name === 'AbortError') {
                    addMessage('assistant', '⏰ 请求超时或已取消，请重试。');
                } else {
                    addMessage('assistant',
                        `❌ 请求失败: ${err.message}，请检查后端服务。`
                    );
                }
            } finally {
                clearTimeout(timeoutId);
                currentAbortController = null;
                isStreaming = false;
                setSendButton(false);
            }
        }

        // ============ 图表渲染 ============
        function renderChart(option) {
            const container = document.getElementById('chartContainer');
            container.classList.add('show');
            if (chartInstance) chartInstance.dispose();
            chartInstance = echarts.init(container);
            chartInstance.setOption(option);
            window.addEventListener('resize', () => {
                if (chartInstance) chartInstance.resize();
            });
        }

        // ============ UI 工具函数 ============
        let msgCounter = 0;

        function addMessage(role, content) {
            const container = document.getElementById('chatContainer');
            const id = `msg-${++msgCounter}`;
            const avatar = role === 'user' ? '👤' : '🤖';

            const div = document.createElement('div');
            div.className = `message ${role}`;
            div.dataset.msgId = id;

            const avatarEl = document.createElement('div');
            avatarEl.className = 'avatar';
            avatarEl.textContent = avatar;

            const bubbleEl = document.createElement('div');
            bubbleEl.className = 'bubble';
            if (role === 'assistant') {
                bubbleEl.innerHTML = renderMarkdown(content);
            } else {
                bubbleEl.textContent = content;   // 用户消息不渲染 Markdown
            }

            div.appendChild(avatarEl);
            div.appendChild(bubbleEl);
            container.appendChild(div);
            scrollChatToBottom();
            return id;
        }

        function addLoading() {
            const container = document.getElementById('chatContainer');
            const id = `loading-${++msgCounter}`;
            const div = document.createElement('div');
            div.className = 'message assistant';
            div.id = id;
            div.innerHTML = `
                <div class="avatar">🤖</div>
                <div class="bubble">
                    <div class="typing-indicator">
                        <span></span><span></span><span></span>
                    </div>
                </div>`;
            container.appendChild(div);
            scrollChatToBottom();
            return id;
        }

        function removeLoading(id) {
            const el = document.getElementById(id);
            if (el) el.remove();
        }

        function scrollChatToBottom() {
            const c = document.getElementById('chatContainer');
            c.scrollTop = c.scrollHeight;
        }
    </script>
</body>
</html>
