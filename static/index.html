<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Excel AI 助手</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f0f2f5;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        /* 顶栏 */
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            padding: 16px 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 2px 8px rgba(0,0,0,.15);
        }
        .header h1 { font-size: 22px; font-weight: 600; }
        .header .actions { display: flex; gap: 12px; }
        .btn {
            padding: 8px 18px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all .2s;
        }
        .btn-upload { background: #fff; color: #667eea; }
        .btn-upload:hover { background: #e8ecff; }
        .btn-download { background: rgba(255,255,255,.2); color: #fff; border: 1px solid rgba(255,255,255,.5); }
        .btn-download:hover { background: rgba(255,255,255,.35); }

        /* 主体 */
        .main {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        /* 左侧：表格区 */
        .panel-table {
            flex: 1;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #e0e0e0;
            background: #fff;
        }
        .panel-table .panel-header {
            padding: 12px 20px;
            font-weight: 600;
            font-size: 15px;
            border-bottom: 1px solid #eee;
            color: #333;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .table-container {
            flex: 1;
            overflow: auto;
            padding: 12px;
        }
        .table-container table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        .table-container th, .table-container td {
            border: 1px solid #e8e8e8;
            padding: 8px 12px;
            text-align: left;
            white-space: nowrap;
        }
        .table-container th {
            background: #fafafa;
            font-weight: 600;
            position: sticky;
            top: 0;
            z-index: 1;
        }
        .table-container tr:hover td { background: #f5f7ff; }
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #999;
            gap: 12px;
        }
        .empty-state svg { width: 64px; height: 64px; opacity: .4; }

        /* 右侧：聊天区 */
        .panel-chat {
            width: 420px;
            min-width: 360px;
            display: flex;
            flex-direction: column;
            background: #fff;
        }
        .panel-chat .panel-header {
            padding: 12px 20px;
            font-weight: 600;
            font-size: 15px;
            border-bottom: 1px solid #eee;
            color: #333;
        }
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .msg {
            max-width: 90%;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.6;
            word-break: break-word;
        }
        .msg-user {
            align-self: flex-end;
            background: #667eea;
            color: #fff;
            border-bottom-right-radius: 4px;
        }
        .msg-ai {
            align-self: flex-start;
            background: #f0f2f5;
            color: #333;
            border-bottom-left-radius: 4px;
        }
        .msg-step {
            align-self: flex-start;
            background: #fffbe6;
            color: #8c6d1f;
            font-size: 12px;
            padding: 6px 10px;
            border-radius: 8px;
            border: 1px solid #ffe58f;
        }
        .chat-input-area {
            padding: 12px 16px;
            border-top: 1px solid #eee;
            display: flex;
            gap: 8px;
        }
        .chat-input-area input {
            flex: 1;
            padding: 10px 14px;
            border: 1px solid #d9d9d9;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: border-color .2s;
        }
        .chat-input-area input:focus { border-color: #667eea; }
        .btn-send {
            background: #667eea;
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 10px 20px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
        }
        .btn-send:hover { background: #5a6fd6; }
        .btn-send:disabled { opacity: .5; cursor: not-allowed; }

        /* 文件信息条 */
        .file-info {
            padding: 8px 20px;
            background: #f6ffed;
            border-bottom: 1px solid #b7eb8f;
            font-size: 13px;
            color: #389e0d;
            display: none;
        }
        .file-info.active { display: block; }

        /* loading */
        .typing-indicator {
            display: flex; gap: 4px; padding: 8px 12px;
        }
        .typing-indicator span {
            width: 8px; height: 8px; background: #999; border-radius: 50%;
            animation: bounce .6s infinite alternate;
        }
        .typing-indicator span:nth-child(2) { animation-delay: .2s; }
        .typing-indicator span:nth-child(3) { animation-delay: .4s; }
        @keyframes bounce { to { transform: translateY(-6px); opacity: .4; } }

        /* 隐藏文件输入 */
        #fileInput { display: none; }
    </style>
</head>
<body>
    <!-- 顶栏 -->
    <div class="header">
        <h1>📊 Excel AI 助手</h1>
        <div class="actions">
            <button class="btn btn-upload" onclick="document.getElementById('fileInput').click()">📁 上传文件</button>
            <button class="btn btn-download" id="btnDownload" onclick="downloadFile()" disabled>⬇️ 下载结果</button>
            <input type="file" id="fileInput" accept=".xlsx,.xls" onchange="uploadFile(this)" />
        </div>
    </div>

    <!-- 主体 -->
    <div class="main">
        <!-- 左侧表格 -->
        <div class="panel-table">
            <div class="panel-header">📋 数据预览</div>
            <div class="file-info" id="fileInfo"></div>
            <div class="table-container" id="tableContainer">
                <div class="empty-state">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                        <polyline points="14 2 14 8 20 8"/>
                        <line x1="16" y1="13" x2="8" y2="13"/>
                        <line x1="16" y1="17" x2="8" y2="17"/>
                    </svg>
                    <p>请上传 Excel 文件开始使用</p>
                </div>
            </div>
        </div>

        <!-- 右侧聊天 -->
        <div class="panel-chat">
            <div class="panel-header">💬 AI 对话</div>
            <div class="chat-messages" id="chatMessages">
                <div class="msg msg-ai">你好！我是 Excel AI 助手。请先上传一个 Excel 文件，然后告诉我你想对数据做什么处理。</div>
            </div>
            <div class="chat-input-area">
                <input type="text" id="chatInput" placeholder="输入你的需求，如：筛选年龄大于30的行..." onkeydown="if(event.key==='Enter')sendMessage()" />
                <button class="btn-send" id="btnSend" onclick="sendMessage()">发送</button>
            </div>
        </div>
    </div>

    <script>
        let sessionId = null;

        // ========== 上传文件 ==========
        async function uploadFile(input) {
            const file = input.files[0];
            if (!file) return;

            const formData = new FormData();
            formData.append('file', file);

            try {
                const res = await fetch('/api/upload', { method: 'POST', body: formData });
                if (!res.ok) throw new Error('上传失败');
                const data = await res.json();

                sessionId = data.session_id;
                document.getElementById('btnDownload').disabled = false;

                // 显示文件信息
                const infoEl = document.getElementById('fileInfo');
                infoEl.classList.add('active');
                infoEl.textContent = `✅ ${data.filename} | ${data.rows} 行 × ${data.columns.length} 列 | 列: ${data.columns.join(', ')}`;

                // 渲染表格
                renderTable(data.columns, data.preview);

                // 聊天提示
                addMessage('ai', `文件 "${data.filename}" 上传成功！共 ${data.rows} 行、${data.columns.length} 列。\n列名：${data.columns.join('、')}\n\n请告诉我你想如何处理这份数据？`);
            } catch (e) {
                alert('上传失败: ' + e.message);
            }
            input.value = '';
        }

        // ========== 渲染表格 ==========
        function renderTable(columns, rows) {
            const container = document.getElementById('tableContainer');
            if (!rows || rows.length === 0) {
                container.innerHTML = '<div class="empty-state"><p>暂无数据</p></div>';
                return;
            }
            let html = '<table><thead><tr>';
            html += '<th>#</th>';
            columns.forEach(c => html += `<th>${escapeHtml(c)}</th>`);
            html += '</tr></thead><tbody>';
            rows.forEach((row, i) => {
                html += '<tr>';
                html += `<td>${i + 1}</td>`;
                columns.forEach(c => {
                    const val = row[c] !== null && row[c] !== undefined ? row[c] : '';
                    html += `<td>${escapeHtml(String(val))}</td>`;
                });
                html += '</tr>';
            });
            html += '</tbody></table>';
            container.innerHTML = html;
        }

        // ========== 发送消息 ==========
        async function sendMessage() {
            const input = document.getElementById('chatInput');
            const msg = input.value.trim();
            if (!msg) return;

            addMessage('user', msg);
            input.value = '';
            setLoading(true);

            try {
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: msg, session_id: sessionId || 'default' }),
                });
                if (!res.ok) throw new Error('请求失败');
                const data = await res.json();
                addMessage('ai', data.reply);

                // 刷新表格预览
                if (sessionId) refreshPreview();
            } catch (e) {
                addMessage('ai', '⚠️ 处理出错: ' + e.message);
            }
            setLoading(false);
        }

        // ========== 刷新预览 ==========
        async function refreshPreview() {
            try {
                const res = await fetch(`/api/preview/${sessionId}`);
                if (!res.ok) return;
                const data = await res.json();
                renderTable(data.columns, data.data);
                const infoEl = document.getElementById('fileInfo');
                infoEl.textContent = `📊 当前数据: ${data.rows} 行 × ${data.columns.length} 列 | 列: ${data.columns.join(', ')}`;
            } catch (e) { /* ignore */ }
        }

        // ========== 下载 ==========
        function downloadFile() {
            if (!sessionId) return;
            window.open(`/api/download/${sessionId}`, '_blank');
        }

        // ========== 工具函数 ==========
        function addMessage(role, text) {
            const container = document.getElementById('chatMessages');
            const div = document.createElement('div');
            div.className = `msg msg-${role === 'user' ? 'user' : 'ai'}`;
            div.textContent = text;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        function setLoading(loading) {
            const btn = document.getElementById('btnSend');
            btn.disabled = loading;
            btn.textContent = loading ? '处理中...' : '发送';

            const container = document.getElementById('chatMessages');
            let indicator = document.getElementById('typingIndicator');
            if (loading) {
                indicator = document.createElement('div');
                indicator.id = 'typingIndicator';
                indicator.className = 'typing-indicator';
                indicator.innerHTML = '<span></span><span></span><span></span>';
                container.appendChild(indicator);
                container.scrollTop = container.scrollHeight;
            } else if (indicator) {
                indicator.remove();
            }
        }

        function escapeHtml(str) {
            return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        }
    </script>
</body>
</html>
