<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge" />
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Excel AI 助手</title>

<!-- Office.js：Excel 加载项运行时 -->
<script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>

<style>
  :root { --excel-green:#217346; --line:#d5dbe3; --bg:#f4f6f8; }
  * { box-sizing: border-box; }
  html, body { height:100%; margin:0; }
  body {
    font-family:"Segoe UI","Microsoft YaHei",sans-serif;
    background:var(--bg); color:#222;
    display:flex; flex-direction:column; height:100vh; overflow:hidden;
  }
  header {
    background:var(--excel-green); color:#fff; padding:10px 14px;
    font-size:15px; font-weight:600; flex-shrink:0;
    display:flex; align-items:center; justify-content:space-between;
  }
  header .conn { font-size:11px; font-weight:400; opacity:.92; }
  #statusbar {
    font-size:11px; color:#555; background:#e9edf1; border-bottom:1px solid var(--line);
    padding:5px 12px; flex-shrink:0; display:flex; justify-content:space-between; align-items:center;
  }
  #statusbar button {
    font-size:11px; border:1px solid var(--excel-green); color:var(--excel-green);
    background:#fff; border-radius:4px; padding:2px 8px; cursor:pointer;
  }
  #chat { flex:1; overflow-y:auto; padding:12px; display:flex; flex-direction:column; gap:10px; }
  .msg { max-width:92%; padding:8px 11px; border-radius:10px; font-size:13px; line-height:1.6;
         white-space:pre-wrap; word-break:break-word; }
  .user { align-self:flex-end; background:var(--excel-green); color:#fff; border-bottom-right-radius:3px; }
  .ai { align-self:flex-start; background:#fff; border:1px solid var(--line); border-bottom-left-radius:3px; }
  .ai details { margin-top:6px; font-size:11px; }
  .ai summary { cursor:pointer; color:var(--excel-green); }
  .ai pre { background:#1e1e1e; color:#e6e6e6; padding:8px; border-radius:6px; overflow:auto; font-size:11px; }
  .tag { display:inline-block; margin-top:6px; font-size:11px; color:var(--excel-green);
         background:#e6f3ec; border:1px solid #b9e0c9; padding:3px 8px; border-radius:5px; cursor:pointer; }
  .chartnote { font-size:11px; color:#777; margin-top:4px; }
  .typing { align-self:flex-start; background:#fff; border:1px solid var(--line); border-radius:10px; padding:8px 12px; font-size:12px; color:#888; }
  .chips { padding:6px 10px; display:flex; gap:6px; flex-wrap:wrap; border-top:1px solid #e6e6e6; flex-shrink:0; }
  .chip { font-size:11px; border:1px solid var(--line); border-radius:12px; padding:3px 10px; cursor:pointer; color:#444; background:#fff; }
  .chip:hover { border-color:var(--excel-green); color:var(--excel-green); }
  .inputbar { display:flex; gap:8px; padding:10px; border-top:1px solid #e6e6e6; background:#fff; flex-shrink:0; }
  .inputbar textarea { flex:1; resize:none; height:48px; border:1px solid #cfd4da; border-radius:6px; padding:7px 9px; font-size:13px; font-family:inherit; outline:none; }
  .inputbar textarea:focus { border-color:var(--excel-green); }
  .inputbar button { background:var(--excel-green); color:#fff; border:none; border-radius:6px; padding:0 18px; cursor:pointer; font-size:13px; }
  .inputbar button:disabled { background:#9ec7b0; cursor:not-allowed; }
  .err { color:#c62828; }
</style>
</head>
<body>
<header>
  <span>📊 Excel AI 助手</span>
  <span class="conn" id="conn">未连接</span>
</header>

<div id="statusbar">
  <span id="sheetinfo">点击「连接工作表」以读取当前活动表数据</span>
  <button id="reconnect">重新连接</button>
</div>

<div id="chat"></div>
<div class="chips" id="chips"></div>
<div class="inputbar">
  <textarea id="q" placeholder="用自然语言提问，例如：各分类的汇总并用柱状图展示"></textarea>
  <button id="send">发送</button>
</div>

<script>
// ==================== 全局 ====================
const API = window.location.origin;      // 与后端同源（HTTPS 提供 taskpane）
let sessionId = null;
let resultCounter = 0;

const $ = id => document.getElementById(id);
const chatEl = $('chat');

function setStatus(txt){ $('conn').textContent = txt; }
function addMsg(role, text, code){
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  div.textContent = text;
  if (code){
    const d = document.createElement('details');
    const s = document.createElement('summary'); s.textContent = '查看结构化操作计划';
    const p = document.createElement('pre'); p.textContent = code;
    d.append(s, p); div.appendChild(d);
  }
  chatEl.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
  return div;
}
function addTyping(){
  const d = document.createElement('div');
  d.className = 'typing'; d.textContent = '分析中…';
  chatEl.appendChild(d); chatEl.scrollTop = chatEl.scrollHeight; return d;
}

// ==================== Office 启动 ====================
Office.onReady(info => {
  if (info.host !== Office.HostType.Excel){
    setStatus('仅支持 Excel'); return;
  }
  renderChips();
  // 自动尝试连接当前工作表
  connect().catch(()=>{ /* 首次可能无数据，用户可稍后手动连接 */ });
});

// ==================== 建立会话：读取活动工作表 ====================
async function connect(){
  setStatus('读取中…');
  let payload;
  await Excel.run(async ctx => {
    const ws = ctx.workbook.worksheets.getActiveWorksheet();
    const used = ws.getUsedRangeOrNullObject(true);
    used.load('values'); used.load('isNullObject');
    await ctx.sync();
    if (used.isNullObject || !used.values || used.values.length === 0){
      throw new Error('当前工作表为空');
    }
    const v = used.values;
    payload = { columns: v[0].map(x => String(x)), rows: v.slice(1) };
  });
  const res = await fetch(API + '/api/session', {
    method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload)
  });
  if (!res.ok){ throw new Error((await res.json()).detail || '建立会话失败'); }
  const d = await res.json();
  sessionId = d.session_id;
  setStatus('已连接 ✓');
  $('sheetinfo').textContent = `${d.filename}：${d.shape[0]} 行 × ${d.shape[1]} 列 · 字段 ${d.columns.slice(0,6).join('、')}${d.columns.length>6?' …':''}`;
  addMsg('ai', `已读取「${d.filename}」(${d.shape[0]} 行 × ${d.shape[1]} 列)。\n现在可以直接提问，结果会写入新的工作表并生成 Excel 原生图表。`);
}

// ==================== 发送问题 ====================
async function send(){
  const q = $('q').value.trim();
  if (!q) return;
  $('q').value = '';
  $('send').disabled = true;
  addMsg('user', q);
  const typing = addTyping();
  try {
    if (!sessionId) await connect();
    const res = await fetch(API + '/api/chat', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ session_id: sessionId, question: q })
    });
    const d = await res.json();
    typing.remove();
    if (!res.ok) throw new Error(d.detail || '请求失败');

    const m = addMsg('ai', d.answer, d.code);
    if (d.has_result && d.result_preview){
      const written = await writeResultToSheet(d);
      const jump = document.createElement('span');
      jump.className = 'tag';
      jump.textContent = `📑 结果已写入工作表「${written}」，点击定位 →`;
      jump.onclick = () => activateSheet(written);
      m.appendChild(jump);
      if (d.chart_url){
        const note = document.createElement('div');
        note.className = 'chartnote';
        note.textContent = '（已生成 Excel 原生图表；同时保留了 AI 绘制图，见工作表图片）';
        m.appendChild(note);
      }
    }
  } catch (e){
    typing.remove();
    const em = addMsg('ai', '出错了：' + e.message);
    em.classList.add('err');
  }
  $('send').disabled = false;
  $('q').focus();
}

// ==================== 写结果到新工作表 + 原生图表 ====================
async function writeResultToSheet(res){
  resultCounter++;
  const baseName = (res.result_sheet_name || ('AI结果' + resultCounter)).replace(/[\\/*?:\[\]]/g,'_').slice(0,30);
  const name = await ensureUniqueName(baseName);
  const cols = res.result_preview.columns;
  const data = res.result_preview.data.map(r => r.map(v => v === null ? '' : v));

  await Excel.run(async ctx => {
    const ws = ctx.workbook.worksheets.add(name);
    ws.load('id');
    await ctx.sync();

    const nrows = data.length + 1, ncols = cols.length;
    const top = ws.getRangeByIndexes(0, 0, nrows, ncols);
    top.values = [cols, ...data];
    top.format.columnWidth = 14;
    top.format.autofitRows();
    // 表头样式（Excel 绿）
    const header = ws.getRangeByIndexes(0, 0, 1, ncols);
    header.format.fill.color = '#217346';
    header.format.font.color = '#ffffff';
    header.format.font.bold = true;
    ws.getRangeByIndexes(0,0,nrows,ncols).format.autofitColumns();
    await ctx.sync();

    await drawNativeChart(ctx, ws, cols, data, name);

    // 可选：插入 matplotlib PNG（ExcelApi 1.8）
    if (res.chart_url && Office.context.requirements.isSetSupported('ExcelApi','1.8')){
      try {
        const b64 = await urlToBase64(API + res.chart_url);
        const anchor = 'A' + (nrows + 2);
        const img = ws.images.addBase64(b64, anchor);
        img.height = 260; img.width = 380;
        await ctx.sync();
      } catch(e){ /* 插入图片失败不影响主流程 */ }
    }

    ws.activate();
    await ctx.sync();
  });
  return name;
}

// 基于结果数据画一个 Excel 原生柱状图
async function drawNativeChart(ctx, ws, cols, data, name){
  const nrows = data.length + 1, ncols = cols.length;
  if (nrows <= 1 || ncols < 2) return;   // 太窄不适合图表

  const numCols = [], textCols = [];
  for (let c=0;c<ncols;c++){
    let n=0, tot=0;
    for (let r=0;r<data.length;r++){
      const v = data[r][c];
      if (v === '' || v === null || v === undefined) continue;
      tot++;
      if (typeof v === 'number') n++;
      else if (typeof v === 'string' && !isNaN(parseFloat(v)) && isFinite(v)) n++;
    }
    if (tot > 0 && n/tot >= 0.6) numCols.push(c); else textCols.push(c);
  }
  if (numCols.length < 1) return;

  try {
    const firstVal = numCols[0];
    const seriesRange = ws.getRangeByIndexes(0, firstVal, nrows, 1); // 含表头作系列名
    const chart = ws.charts.add('columnClustered', seriesRange, 'auto');
    for (let i=1;i<numCols.length;i++){
      chart.series.add(ws.getRangeByIndexes(0, numCols[i], nrows, 1), 'auto');
    }
    const catCol = textCols.length ? textCols[0] : null;
    if (catCol !== null){
      chart.categories = ws.getRangeByIndexes(1, catCol, data.length, 1);
    }
    chart.name = (name + '_图表').slice(0,30);
    try { chart.legend.position = 'right'; } catch(e){}
    try {
      const start = ws.getRangeByIndexes(0, ncols + 1, 1, 1);
      const end   = ws.getRangeByIndexes(16, ncols + 9, 1, 1);
      chart.setPosition(start, end);
    } catch(e){}
    await ctx.sync();
  } catch(e){ /* 图表 API 不支持时静默跳过 */ }
}

// ==================== 工具函数 ====================
async function ensureUniqueName(base){
  let candidate = base, i = 1;
  await Excel.run(async ctx => {
    while (true){
      const probe = ctx.workbook.worksheets.getItemOrNullObject(candidate);
      probe.load('isNullObject');
      await ctx.sync();
      if (probe.isNullObject) break;
      i++; candidate = (base + '_' + i).slice(0,30);
    }
  });
  return candidate;
}

async function activateSheet(name){
  await Excel.run(async ctx => {
    const ws = ctx.workbook.worksheets.getItem(name);
    ws.activate();
    await ctx.sync();
  });
}

function urlToBase64(url){
  return fetch(url).then(r => r.blob()).then(blob => new Promise((resolve, reject) => {
    const fr = new FileReader();
    fr.onload = () => resolve(fr.result.split(',')[1]);
    fr.onerror = reject;
    fr.readAsDataURL(blob);
  }));
}

function renderChips(){
  const chips = $('chips');
  ['数据基本情况', '各分类求和并画柱状图', '数值最大前10行', '占比分布饼图']
    .forEach(t => {
      const s = document.createElement('span');
      s.className='chip'; s.textContent=t;
      s.onclick = () => { $('q').value = t; send(); };
      chips.appendChild(s);
    });
}

$('send').onclick = send;
$('reconnect').onclick = () => connect().catch(e => addMsg('ai', '连接失败：' + e.message));
$('q').addEventListener('keydown', e => { if (e.key==='Enter' && !e.shiftKey){ e.preventDefault(); send(); } });
</script>
</body>
</html>
